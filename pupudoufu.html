<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RetroCam - 复古拍立得</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Caveat (手写体) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .font-handwriting { font-family: 'Caveat', cursive; }
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes developPhoto {
            0% { filter: brightness(5) blur(10px) grayscale(100%); opacity: 0.2; }
            50% { filter: brightness(2) blur(5px) grayscale(50%); opacity: 0.8; }
            100% { filter: brightness(1) blur(0px) grayscale(0%); opacity: 1; }
        }
        .animate-develop { animation: developPhoto 3s forwards; }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }
    </style>
</head>
<body class="bg-stone-200 text-stone-800 font-sans overflow-hidden relative selection:bg-amber-200 touch-none transition-colors duration-500">

    <!-- 屏幕补光层 -->
    <div id="fillLightLayer" class="fixed inset-0 pointer-events-none z-0 transition-all duration-500" style="background-color: #ffffff; opacity: 0;"></div>
    <div id="fillLightGlow" class="fixed inset-0 pointer-events-none z-[100] transition-all duration-500" style="box-shadow: none;"></div>

    <!-- 隐藏的 Canvas -->
    <canvas id="photoCanvas" class="hidden"></canvas>
    <canvas id="posterCanvas" class="hidden"></canvas>

    <!-- 顶部栏 -->
    <header class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-50 pointer-events-none">
        <h1 class="text-3xl font-bold tracking-tighter text-stone-700 flex items-center gap-2 drop-shadow-sm">
            <i data-lucide="camera" class="w-8 h-8"></i> RetroCam
        </h1>
        <div class="flex gap-3 pointer-events-auto" id="headerButtons">
            <button id="btnLightStudio" class="px-4 py-2 rounded-full shadow-lg transition flex items-center gap-2 border-2 bg-white border-white text-stone-600 hover:bg-stone-50">
                <i data-lucide="sparkles" class="w-4 h-4"></i> <span class="hidden sm:inline">光效工作室</span>
            </button>
            <button id="btnBackToCamera" class="hidden bg-stone-800 text-white px-4 py-2 rounded-full shadow-lg hover:bg-stone-700 transition flex items-center gap-2">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> 返回相机
            </button>
        </div>
    </header>

    <!-- 光效工作室面板 -->
    <div id="lightPanel" class="hidden absolute top-24 left-6 z-50 bg-white/90 backdrop-blur-md p-5 rounded-2xl shadow-xl border border-white/50 w-72 animate-in fade-in slide-in-from-left-5">
        <div class="space-y-6">
            <!-- 美颜参数 -->
            <div class="space-y-4">
                <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider">iPhone 质感美颜</h4>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-xs font-bold text-stone-600">改善肤质 (去细纹)</label>
                        <span class="text-[10px] text-stone-400" id="valSmooth">0</span>
                    </div>
                    <input type="range" id="inputSmooth" min="0" max="3" step="0.5" value="0" class="w-full h-1.5 bg-stone-200 rounded-lg accent-pink-500 cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-xs font-bold text-stone-600">精致瘦脸</label>
                        <span class="text-[10px] text-stone-400" id="valThinFace">0</span>
                    </div>
                    <input type="range" id="inputThinFace" min="0" max="3" step="0.5" value="0" class="w-full h-1.5 bg-stone-200 rounded-lg accent-pink-500 cursor-pointer">
                </div>
                 <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-xs font-bold text-stone-600">灵动大眼 (亮眼)</label>
                        <span class="text-[10px] text-stone-400" id="valBigEye">0</span>
                    </div>
                    <input type="range" id="inputBigEye" min="0" max="3" step="0.5" value="0" class="w-full h-1.5 bg-stone-200 rounded-lg accent-pink-500 cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-xs font-bold text-stone-600">美白提亮</label>
                        <span class="text-[10px] text-stone-400" id="valWhiten">0</span>
                    </div>
                    <input type="range" id="inputWhiten" min="0" max="3" step="0.5" value="0" class="w-full h-1.5 bg-stone-200 rounded-lg accent-pink-500 cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-xs font-bold text-stone-600">五官立体</label>
                        <span class="text-[10px] text-stone-400" id="valSharp">0</span>
                    </div>
                    <input type="range" id="inputSharp" min="0" max="2" step="0.2" value="0" class="w-full h-1.5 bg-stone-200 rounded-lg accent-pink-500 cursor-pointer">
                </div>
            </div>
            <div class="h-px bg-stone-200"></div>
            <!-- 补光控制 -->
            <div>
                <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-3">屏幕补光灯</h4>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-stone-600 flex items-center gap-1"><i data-lucide="sun" class="w-3 h-3 text-amber-500"></i> 强度</label>
                    <span class="text-[10px] text-stone-400" id="valIntensity">0%</span>
                </div>
                <input type="range" id="inputIntensity" min="0" max="1" step="0.05" value="0" class="w-full h-2 bg-stone-200 rounded-lg accent-amber-500 cursor-pointer">
                <div class="mt-4 flex gap-2 flex-wrap" id="colorPresets">
                    <!-- 动态生成颜色按钮 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 主视图容器 -->
    <main id="mainView" class="flex flex-col items-center justify-center h-screen relative z-10 pb-20 transition-opacity duration-300">
        
        <!-- 闪光灯效果 -->
        <div id="flashOverlay" class="absolute inset-0 bg-white pointer-events-none z-[60] opacity-0 transition-opacity duration-300"></div>

        <!-- 相机主体 -->
        <div class="relative z-20 scale-90 md:scale-100 transition-transform">
            
            <!-- 显影出口动画层 -->
            <div id="developingPhotoContainer" class="absolute top-0 left-1/2 -translate-x-1/2 w-48 transition-all duration-[1500ms] ease-out z-10 translate-y-10 opacity-0">
                <div class="p-3 pb-8 shadow-xl rotate-0 border border-black/5 bg-white" id="devPhotoFrame">
                    <div class="w-full h-56 bg-stone-900 overflow-hidden relative">
                        <div class="absolute inset-0 w-full h-full bg-stone-200 z-20 mix-blend-hard-light" id="devPhotoAnim"></div>
                        <img id="devPhotoImg" src="" class="w-full h-full object-cover filter contrast-105 sepia-[0.1]">
                    </div>
                </div>
            </div>

            <!-- 机身外壳 -->
            <div class="w-80 bg-[#f4f1ea] rounded-[2.5rem] p-6 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.3),inset_0_-4px_10px_rgba(0,0,0,0.1)] border border-[#e6e2d8] relative z-20 overflow-hidden">
                 <!-- 机身漫反射层 -->
                <div id="bodyReflection" class="absolute inset-0 rounded-[2.5rem] pointer-events-none transition-colors duration-500 opacity-0 mix-blend-multiply bg-white"></div>

                <!-- 彩虹条 -->
                <div class="absolute bottom-12 left-1/2 -translate-x-1/2 w-full flex justify-center pointer-events-none z-10">
                    <div class="h-32 w-4 bg-[#ff3b30]"></div>
                    <div class="h-32 w-4 bg-[#ff9500]"></div>
                    <div class="h-32 w-4 bg-[#ffcc00]"></div>
                    <div class="h-32 w-4 bg-[#4cd964]"></div>
                    <div class="h-32 w-4 bg-[#007aff]"></div>
                    <div class="h-32 w-4 bg-[#5856d6]"></div>
                </div>

                <!-- 取景器/镜头 -->
                <div class="relative bg-stone-900 w-64 h-64 mx-auto rounded-full border-8 border-stone-300 shadow-inner overflow-hidden ring-4 ring-black/10 z-20">
                     <!-- 环形补光灯模拟 -->
                     <div id="ringLight" class="absolute inset-0 rounded-full pointer-events-none transition-all duration-300 opacity-0" style="border: 2px solid white;"></div>
                     
                     <div class="absolute top-4 left-4 w-20 h-10 bg-white/10 rounded-full blur-xl z-30 pointer-events-none"></div>
                     <video id="videoElement" autoplay playsinline muted class="w-full h-full object-cover transform scale-x-[-1]"></video>
                     <div id="cameraError" class="absolute inset-0 flex items-center justify-center text-stone-500 text-sm p-4 text-center hidden">正在连接镜头...</div>
                </div>

                <!-- 快门区域 -->
                <div class="flex justify-between items-center mt-8 px-4 relative z-20">
                    <div class="w-12 h-8 bg-stone-800 rounded-sm relative overflow-hidden border border-stone-600"><div class="absolute inset-0 bg-gradient-to-tr from-transparent to-white/30"></div></div>
                    
                    <button id="shutterBtn" class="w-16 h-16 rounded-full border-4 border-stone-300 shadow-lg transition-all active:scale-95 flex items-center justify-center bg-red-600 hover:bg-red-500 cursor-pointer">
                        <div class="w-12 h-12 rounded-full border border-white/20"></div>
                    </button>

                    <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse shadow-[0_0_10px_#22c55e]"></div>
                </div>
                
                <!-- 出纸口 -->
                <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-56 h-3 bg-stone-800 rounded-full shadow-inner z-30"></div>
            </div>
        </div>

        <!-- 散落照片容器 -->
        <div id="loosePhotosContainer"></div>

        <!-- 解锁新年皮肤悬浮按钮 -->
        <button id="unlockNewYearBtn" class="hidden fixed bottom-32 right-6 z-[70] bg-gradient-to-r from-red-500 to-amber-500 text-white p-3 rounded-full shadow-lg shadow-red-500/30 animate-bounce hover:scale-110 transition group" title="解锁新年皮肤">
            <i data-lucide="gift" class="w-6 h-6"></i>
            <span class="absolute right-full mr-2 top-1/2 -translate-y-1/2 bg-white text-red-500 text-xs font-bold px-2 py-1 rounded-md whitespace-nowrap opacity-0 group-hover:opacity-100 transition shadow-sm">生成年度海报</span>
        </button>

        <!-- 底部相册入口 -->
        <div id="galleryDock" class="fixed bottom-28 right-8 transition-all duration-300 hover:scale-110 cursor-pointer z-40 group">
             <div class="relative pointer-events-none">
                <div class="absolute inset-0 bg-stone-100 rotate-6 rounded-lg shadow-md translate-x-2 translate-y-2 border border-stone-300"></div>
                <div class="absolute inset-0 bg-stone-100 -rotate-3 rounded-lg shadow-md -translate-x-1 translate-y-1 border border-stone-300"></div>
                <div class="relative w-28 h-28 bg-stone-100 rounded-lg shadow-2xl flex flex-col items-center justify-center border-4 border-stone-300 transition-colors overflow-hidden" id="galleryCover">
                     <i data-lucide="image" class="text-stone-300 w-10 h-10 mb-1"></i>
                     <div class="absolute bottom-0 w-full bg-white/90 backdrop-blur-sm text-center py-1 text-xs font-bold text-stone-600 border-t border-stone-200">
                        <span id="photoCountBadge">0</span> 张照片
                     </div>
                </div>
                <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-max bg-stone-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">查看相册</div>
             </div>
        </div>

        <!-- 底部相纸选择栏 (Dock) -->
        <div class="fixed bottom-0 left-0 right-0 z-[60] flex justify-center pb-6 pt-12 pointer-events-none bg-gradient-to-t from-stone-200/90 via-stone-200/50 to-transparent">
            <div class="pointer-events-auto bg-white/70 backdrop-blur-md px-2 py-2 rounded-2xl shadow-lg border border-white/50 flex gap-2 overflow-x-auto max-w-[90vw] no-scrollbar snap-x items-center" id="framesDock">
                <!-- 动态生成相纸按钮 -->
            </div>
        </div>
    </main>

    <!-- 照片墙视图 (Gallery View) -->
    <section id="galleryView" class="hidden min-h-screen p-8 pt-24 bg-stone-800 overflow-y-auto custom-scrollbar relative z-10">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-white text-xl font-bold flex items-center gap-2">
                    <i data-lucide="image" class="text-amber-400 w-6 h-6"></i> 我的影集 (<span id="galleryCount">0</span>)
                </h2>
                <button id="btnGenerateGalleryPoster" class="hidden bg-gradient-to-r from-amber-400 to-orange-500 text-white px-4 py-2 rounded-full shadow-lg hover:shadow-orange-500/20 transition flex items-center gap-2 font-bold text-sm">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i> 生成影集海报
                </button>
            </div>
            
            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                <!-- 动态生成照片列表 -->
            </div>
            
            <div id="galleryEmptyState" class="flex flex-col items-center justify-center h-96 text-stone-400">
                <i data-lucide="aperture" class="w-16 h-16 mb-4 opacity-50"></i>
                <p class="text-xl">相册是空的，快去拍几张！</p>
                <button onclick="switchView('camera')" class="mt-6 text-amber-400 hover:text-amber-300 underline">返回拍摄</button>
            </div>
        </div>
    </section>

    <!-- 解锁弹窗 (Slide Up) -->
    <div id="unlockModal" class="fixed bottom-0 left-0 right-0 z-[100] transform translate-y-[120%] transition-transform duration-500 cubic-bezier(0.16, 1, 0.3, 1) flex justify-center pointer-events-none">
        <div class="bg-white/95 backdrop-blur-xl w-full max-w-md mx-4 mb-6 rounded-3xl shadow-2xl border border-white/50 p-6 pointer-events-auto relative overflow-hidden">
            <!-- 弹窗内容动态注入 -->
            <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-yellow-100/50 to-transparent pointer-events-none"></div>
            
            <!-- 分享中状态 -->
            <div id="modalSharingState" class="hidden relative z-10 flex flex-col items-center text-center py-8">
                 <div class="w-16 h-16 border-4 border-stone-100 border-t-amber-500 rounded-full animate-spin mb-6"></div>
                 <h3 class="text-xl font-bold text-stone-800 flex items-center gap-2">
                     <i data-lucide="check-circle-2" class="text-green-500 w-6 h-6"></i> 文案已复制
                 </h3>
                 <div class="bg-stone-50 p-4 rounded-xl mt-4 w-full text-left border border-stone-200">
                     <p class="text-stone-500 text-sm mb-2 flex items-center gap-2"><span class="bg-stone-200 text-stone-600 px-2 py-0.5 rounded text-xs font-bold">Step 1</span> 打开微信/QQ/抖音</p>
                     <p class="text-stone-500 text-sm mb-2 flex items-center gap-2"><span class="bg-stone-200 text-stone-600 px-2 py-0.5 rounded text-xs font-bold">Step 2</span> 粘贴并发送给好友</p>
                     <p class="text-stone-800 text-sm font-bold flex items-center gap-2"><span class="bg-amber-100 text-amber-600 px-2 py-0.5 rounded text-xs font-bold">Step 3</span> 返回此页面，自动解锁！</p>
                 </div>
                 <button id="btnRetryShare" class="mt-6 text-stone-400 text-sm underline">重新选择分享方式</button>
            </div>

            <!-- 正常引导状态 -->
            <div id="modalNormalState" class="relative z-10 flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mb-4 text-yellow-600 animate-bounce">
                    <i data-lucide="gift" class="w-8 h-8"></i>
                </div>
                <h3 id="modalTitle" class="text-xl font-bold text-stone-800 mb-2">解锁新相纸</h3>
                <p id="modalDesc" class="text-sm text-stone-500 mb-6 px-4">只需分享给 1 位好友，即可永久免费解锁！</p>
                
                <div id="modalPreview" class="mb-6 scale-75 origin-center shadow-lg rounded-sm overflow-hidden">
                    <!-- 预览内容 -->
                </div>

                <div class="grid grid-cols-4 gap-4 w-full mb-4">
                    <button class="share-btn flex flex-col items-center gap-2 group" data-platform="wechat"><div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center group-hover:bg-green-500 group-hover:text-white transition-colors shadow-sm"><i data-lucide="message-circle" class="w-5 h-5"></i></div><span class="text-xs text-stone-500">微信</span></button>
                    <button class="share-btn flex flex-col items-center gap-2 group" data-platform="qq"><div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors shadow-sm"><i data-lucide="message-square" class="w-5 h-5"></i></div><span class="text-xs text-stone-500">QQ</span></button>
                    <button class="share-btn flex flex-col items-center gap-2 group" data-platform="douyin"><div class="w-12 h-12 bg-stone-100 text-stone-800 rounded-full flex items-center justify-center group-hover:bg-stone-800 group-hover:text-white transition-colors shadow-sm"><i data-lucide="music" class="w-5 h-5"></i></div><span class="text-xs text-stone-500">抖音</span></button>
                    <button class="share-btn flex flex-col items-center gap-2 group" data-platform="link"><div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition-colors shadow-sm"><i data-lucide="link" class="w-5 h-5"></i></div><span class="text-xs text-stone-500">复制</span></button>
                </div>
                <button id="btnCloseModal" class="text-stone-400 text-sm hover:text-stone-600 underline">暂不解锁，先保存照片</button>
            </div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        // --- 数据配置 ---
        const FRAMES = [
            { id: 'classic', name: '经典白', type: 'solid', color: '#ffffff', textColor: '#57534e', unlocked: true },
            { id: 'cream', name: '复古杏', type: 'solid', color: '#fef3c7', textColor: '#78350f', unlocked: true },
            { id: 'pink', name: '樱花粉', type: 'solid', color: '#fce7f3', textColor: '#831843', unlocked: false },
            { id: 'dark', name: '暗夜黑', type: 'solid', color: '#1c1917', textColor: '#e7e5e4', unlocked: false },
            { id: 'blue', name: '雾霾蓝', type: 'solid', color: '#e0f2fe', textColor: '#0c4a6e', unlocked: false },
            { id: 'gold', name: '流光金', type: 'gradient', color: ['#fef9c3', '#d97706'], textColor: '#451a03', unlocked: false },
            { id: 'newyear', name: '新年红', type: 'gradient', color: ['#b91c1c', '#dc2626'], textColor: '#fecaca', unlocked: false, special: true },
        ];

        const LIGHT_PRESETS = [
            { name: '自然', color: '#ffffff' },
            { name: '落日', color: '#FF4500' },
            { name: '甜粉', color: '#FF69B4' },
            { name: '极光', color: '#00FFFF' },
            { name: '霓虹', color: '#D500F9' },
        ];

        // --- 全局状态 ---
        let state = {
            photos: [],
            currentFrameId: 'classic',
            unlockedFrameIds: ['classic', 'cream'],
            beauty: { smooth: 0, whiten: 0, sharp: 0, thinFace: 0, bigEye: 0 },
            fillLight: { color: '#ffffff', intensity: 0 },
            isDeveloping: false,
            photoCount: 0,
            activeDragId: null,
            targetUnlockFrame: null,
            isSharing: false,
            didLeave: false,
            posterImage: null
        };

        let stream = null;
        let dragOffset = { x: 0, y: 0 };
        const videoElement = document.getElementById('videoElement');
        
        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initCamera();
            renderFramesDock();
            initLightPanel();
            bindEvents();
        });

        // --- 相机逻辑 ---
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 4096 }, height: { ideal: 4096 } }
                });
                videoElement.srcObject = stream;
            } catch (err) {
                document.getElementById('cameraError').innerText = "无法访问摄像头或设备被占用";
                document.getElementById('cameraError').classList.remove('hidden');
                console.error(err);
            }
        }

        function getBeautyFilterString() {
            let blur = state.beauty.smooth * 0.2;
            let brightness = 100 + (state.beauty.smooth * 6) + (state.beauty.whiten * 8);
            let contrast = 100 - (state.beauty.smooth * 4) + (state.beauty.sharp * 12) + (state.beauty.bigEye * 10);
            let saturate = 100 - (state.beauty.whiten * 5) + (state.beauty.sharp * 8) + (state.beauty.bigEye * 5);
            return `blur(${blur}px) brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%) sepia(5%)`;
        }

        function updateVideoFilter() {
            // 预览时同时应用美颜和瘦脸变换
            const filterStr = getBeautyFilterString();
            const scaleY = 1 + (state.beauty.thinFace * 0.03);
            videoElement.style.filter = filterStr;
            videoElement.style.transform = `scale(-1, ${scaleY})`; // 保持镜像并纵向拉伸
            videoElement.style.transformOrigin = 'center center';
        }

        function updateFillLight() {
            const layer = document.getElementById('fillLightLayer');
            const glow = document.getElementById('fillLightGlow');
            const bodyRef = document.getElementById('bodyReflection');
            const ringLight = document.getElementById('ringLight');

            layer.style.backgroundColor = state.fillLight.color;
            layer.style.opacity = state.fillLight.intensity;

            if (state.fillLight.intensity > 0) {
                glow.style.boxShadow = `inset 0 0 ${state.fillLight.intensity * 150}px ${state.fillLight.intensity * 40}px ${state.fillLight.color}`;
                
                bodyRef.style.backgroundColor = state.fillLight.color;
                bodyRef.style.opacity = state.fillLight.intensity * 0.4;
                
                ringLight.style.boxShadow = `inset 0 0 ${state.fillLight.intensity * 30}px ${state.fillLight.color}, 0 0 ${state.fillLight.intensity * 20}px ${state.fillLight.color}`;
                ringLight.style.borderColor = state.fillLight.color;
                ringLight.style.opacity = 0.8;
            } else {
                glow.style.boxShadow = 'none';
                bodyRef.style.opacity = 0;
                ringLight.style.opacity = 0;
            }
        }

        // --- 拍照核心 ---
        function takePhoto() {
            if (state.isDeveloping) return;
            state.isDeveloping = true;

            // Flash effect
            const flash = document.getElementById('flashOverlay');
            flash.classList.remove('opacity-0');
            setTimeout(() => flash.classList.add('opacity-0'), 200);

            const canvas = document.getElementById('photoCanvas');
            const ctx = canvas.getContext('2d');
            const size = Math.min(videoElement.videoWidth, videoElement.videoHeight);
            canvas.width = size;
            canvas.height = size;
            
            const startX = (videoElement.videoWidth - size) / 2;
            const startY = (videoElement.videoHeight - size) / 2;

            ctx.save();
            // 应用瘦脸变换
            const stretch = 1 + (state.beauty.thinFace * 0.03);
            const drawHeight = size * stretch;
            const drawY = (size - drawHeight) / 2;

            ctx.translate(size, 0);
            ctx.scale(-1, 1);
            ctx.filter = getBeautyFilterString();
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(videoElement, startX, startY, size, size, 0, drawY, size, drawHeight);
            ctx.filter = 'none';
            ctx.restore();

            const photoData = canvas.toDataURL('image/png', 1.0);
            
            // 显影动画
            const devContainer = document.getElementById('developingPhotoContainer');
            const devImg = document.getElementById('devPhotoImg');
            const devAnim = document.getElementById('devPhotoAnim');
            const devFrame = document.getElementById('devPhotoFrame');

            // 应用当前边框样式到显影相纸
            const currentFrame = FRAMES.find(f => f.id === state.currentFrameId);
            if(currentFrame.type === 'gradient') {
                devFrame.style.background = `linear-gradient(135deg, ${currentFrame.color[0]}, ${currentFrame.color[1]})`;
            } else {
                devFrame.style.backgroundColor = currentFrame.color;
            }

            devImg.src = photoData;
            devContainer.classList.remove('translate-y-10', 'opacity-0');
            devContainer.classList.add('-translate-y-[85%]'); // 弹出
            devAnim.classList.add('animate-develop');

            state.photoCount++;

            // 1.8秒后完成显影，生成散落照片
            setTimeout(() => {
                // 重置显影动画
                devContainer.classList.add('translate-y-10', 'opacity-0');
                devContainer.classList.remove('-translate-y-[85%]');
                devAnim.classList.remove('animate-develop');
                state.isDeveloping = false;

                // 计算落点
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                let x, y;
                const photoW = 192; // w-48
                const centerX = winW / 2;

                if (winW > 768) {
                    const isRight = Math.random() > 0.5;
                    if (isRight) x = centerX + 220 + Math.random() * (winW/2 - 220 - photoW);
                    else x = 40 + Math.random() * (centerX - 220 - photoW);
                    y = 80 + Math.random() * (winH - 400);
                } else {
                    x = 20 + Math.random() * (winW - 40 - photoW);
                    y = (winH / 2) + 180 + Math.random() * 100;
                }
                
                // 边界修正
                if (x < 10) x = 10;
                if (x + photoW > winW) x = winW - photoW - 10;
                if (y + 240 > winH) y = winH - 250;

                const newPhoto = {
                    id: Date.now(),
                    url: photoData,
                    date: new Date().toLocaleString(),
                    x: x,
                    y: y,
                    rotation: (Math.random() * 30) - 15,
                    archived: false,
                    frameId: state.currentFrameId
                };

                state.photos.push(newPhoto);
                renderLoosePhotos();
                updateGalleryButton();
                checkNewYearButton();

            }, 1800);
        }

        // --- 渲染散落照片 ---
        function renderLoosePhotos() {
            const container = document.getElementById('loosePhotosContainer');
            container.innerHTML = '';
            
            state.photos.filter(p => !p.archived).forEach(photo => {
                const el = document.createElement('div');
                el.className = `fixed z-50 cursor-grab w-48 touch-none select-none transition-transform duration-300 ease-out`;
                el.style.left = `${photo.x}px`;
                el.style.top = `${photo.y}px`;
                el.style.zIndex = state.activeDragId === photo.id ? 100 : 50;
                // 如果正在拖拽，移除 transition 以跟手
                if (state.activeDragId === photo.id) {
                    el.style.transition = 'none';
                    el.style.transform = `rotate(${photo.rotation}deg) scale(1.1)`;
                } else {
                    el.style.transform = `rotate(${photo.rotation}deg)`;
                }

                // 边框样式
                const frame = FRAMES.find(f => f.id === photo.frameId);
                const bgStyle = frame.type === 'gradient' ? `background: linear-gradient(135deg, ${frame.color[0]}, ${frame.color[1]})` : `background-color: ${frame.color}`;

                el.innerHTML = `
                    <div class="relative shadow-xl hover:scale-105 transition-transform duration-300 group">
                        <!-- 按钮组 -->
                        <button onclick="archiveOne('${photo.id}')" class="absolute -top-3 -left-3 bg-white text-stone-400 p-2 rounded-full shadow-md hover:bg-emerald-500 hover:text-white transition z-50 flex items-center justify-center pointer-events-auto"><i data-lucide="archive" class="w-4 h-4"></i></button>
                        <button onclick="deleteOne('${photo.id}')" class="absolute -top-3 -right-3 bg-white text-stone-400 p-2 rounded-full shadow-md hover:bg-red-500 hover:text-white transition z-50 flex items-center justify-center pointer-events-auto"><i data-lucide="x" class="w-4 h-4"></i></button>
                        
                        <!-- 相纸主体 -->
                        <div class="p-3 pb-8 shadow-sm border border-black/5" style="${bgStyle}">
                            <div class="w-full h-56 bg-stone-900 overflow-hidden relative pointer-events-none">
                                <img src="${photo.url}" class="w-full h-full object-cover filter contrast-105 sepia-[0.1]">
                                <div class="absolute inset-0 opacity-5 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>
                            </div>
                            <div class="mt-4 font-handwriting text-center text-sm pointer-events-none" style="color: ${frame.textColor}">
                                ${photo.date}
                            </div>
                        </div>

                        <!-- 下载按钮 -->
                        <button onclick="downloadOne('${photo.id}')" class="absolute -bottom-3 -right-3 bg-white text-stone-400 p-2 rounded-full shadow-md hover:bg-blue-500 hover:text-white transition z-50 flex items-center justify-center pointer-events-auto"><i data-lucide="download" class="w-4 h-4"></i></button>
                    </div>
                `;
                
                // 绑定拖拽事件
                el.onpointerdown = (e) => handlePointerDown(e, photo.id);
                // 绑定双击旋转
                el.ondblclick = (e) => { e.stopPropagation(); rotatePhoto(photo.id, 90); };
                // 绑定滚轮旋转
                el.onwheel = (e) => { e.stopPropagation(); rotatePhoto(photo.id, e.deltaY > 0 ? 5 : -5); };

                container.appendChild(el);
            });
            lucide.createIcons();
        }

        // --- 交互逻辑 ---
        function handlePointerDown(e, id) {
            if (e.target.closest('button')) return;
            e.preventDefault();
            e.stopPropagation();
            state.activeDragId = id;
            
            // 提升层级：把当前照片移到数组末尾
            const others = state.photos.filter(p => p.id !== id);
            const current = state.photos.find(p => p.id === id);
            state.photos = [...others, current];
            
            // 记录偏移
            const el = e.currentTarget;
            dragOffset.x = e.clientX - parseInt(el.style.left);
            dragOffset.y = e.clientY - parseInt(el.style.top);
            
            renderLoosePhotos(); // 重新渲染以更新层级和样式
            try { el.setPointerCapture(e.pointerId); } catch(err) {}
        }

        function handlePointerMove(e) {
            if (!state.activeDragId) return;
            e.preventDefault();
            const newX = e.clientX - dragOffset.x;
            const newY = e.clientY - dragOffset.y;
            
            // 更新位置数据
            const p = state.photos.find(p => p.id === state.activeDragId);
            if(p) { p.x = newX; p.y = newY; }
            
            // 直接操作DOM以提高性能
            // renderLoosePhotos 可能会有点慢，这里只在move时更新style
            renderLoosePhotos(); // 还是全量渲染简单，React模式下是这么做的

            // 检测相册吸附
            const dock = document.getElementById('galleryDock');
            const rect = dock.getBoundingClientRect();
            if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                 document.getElementById('galleryCover').classList.add('border-amber-400', 'bg-amber-50');
            } else {
                 document.getElementById('galleryCover').classList.remove('border-amber-400', 'bg-amber-50');
            }
        }

        function handlePointerUp(e) {
            if (!state.activeDragId) return;
            const id = state.activeDragId;
            state.activeDragId = null;

            const dock = document.getElementById('galleryDock');
            const rect = dock.getBoundingClientRect();
            if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                // 归档
                archiveOne(id);
            }
            
            document.getElementById('galleryCover').classList.remove('border-amber-400', 'bg-amber-50');
            renderLoosePhotos();
        }

        // --- 功能函数 ---
        function archiveOne(id) {
            const p = state.photos.find(p => p.id == id);
            if(p) p.archived = true;
            renderLoosePhotos();
            updateGalleryButton();
        }

        function deleteOne(id) {
            state.photos = state.photos.filter(p => p.id != id);
            renderLoosePhotos();
        }

        function rotatePhoto(id, deg) {
            const p = state.photos.find(p => p.id == id);
            if(p) p.rotation += deg;
            renderLoosePhotos();
        }

        // --- Canvas 绘图与海报 ---
        function generateCollectionPoster(targetFrame) {
            // 注意：这里参数接收的是 frame 对象本身，不是 ID
            state.targetUnlockFrame = targetFrame;
            state.posterImage = null; // reset

            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');
            const width = 1080;
            const height = 1440;
            canvas.width = width;
            canvas.height = height;

            // 背景
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#991b1b');
            gradient.addColorStop(1, '#450a0a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 纹理
            ctx.save();
            for(let i=0; i<15000; i++) {
                ctx.fillStyle = `rgba(255,215,0,${Math.random() * 0.08})`; 
                ctx.fillRect(Math.random() * width, Math.random() * height, 2, 2);
            }
            ctx.restore();

            // 灯笼光影
            ctx.save();
            const lanternGrd1 = ctx.createRadialGradient(200, 100, 0, 200, 100, 300);
            lanternGrd1.addColorStop(0, 'rgba(252, 211, 77, 0.25)'); 
            lanternGrd1.addColorStop(1, 'rgba(252, 211, 77, 0)');
            ctx.fillStyle = lanternGrd1;
            ctx.beginPath(); ctx.arc(200, 100, 300, 0, Math.PI*2); ctx.fill();
            // ... 线条 ...
            ctx.strokeStyle = 'rgba(252, 211, 77, 0.3)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(200, 0); ctx.lineTo(200, 150); ctx.stroke();
            ctx.restore();

            // 文案
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fef3c7'; 
            ctx.font = 'bold 90px sans-serif'; 
            ctx.fillText('2026 新春大吉', width/2, 200);
            ctx.font = '32px sans-serif';
            ctx.fillStyle = '#fbbf24'; 
            ctx.fillText('丙午马年 · 限定珍藏', width/2, 270);

            // 绘制照片
            let photosToDraw = [...state.photos].reverse().slice(0, 3);
            if(photosToDraw.length === 0) { alert("没有照片可生成"); return; }
            
            let loaded = 0;
            
            const drawPolaroid = (img, x, y, rot, date) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rot * Math.PI / 180);
                
                // 边框 (使用新年的红色)
                const pW = 320; const pH = 400;
                const grd = ctx.createLinearGradient(-pW/2, -pH/2, pW/2, pH/2);
                grd.addColorStop(0, '#b91c1c'); grd.addColorStop(1, '#ef4444'); 
                ctx.fillStyle = grd;
                ctx.beginPath(); ctx.roundRect(-pW/2, -pH/2, pW, pH, 6); ctx.fill();
                
                // 照片内容
                ctx.fillStyle = '#262626';
                const imgSize = 280;
                ctx.fillRect(-imgSize/2, -pH/2 + 20, imgSize, imgSize);
                ctx.drawImage(img, -imgSize/2, -pH/2 + 20, imgSize, imgSize);
                
                // 文字
                ctx.fillStyle = '#fef3c7'; 
                ctx.font = '24px "Caveat", cursive, sans-serif'; 
                ctx.textAlign = 'center';
                ctx.fillText(date, 0, pH/2 - 35);
                ctx.restore();
            };

            photosToDraw.forEach((p, i) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = p.url;
                img.onload = () => {
                    let x, y, rot;
                    if (i === 0) { x = width/2; y = height/2 + 50; rot = -2; }
                    else if (i === 1) { x = width/2 - 140; y = height/2 - 180; rot = -12; }
                    else { x = width/2 + 140; y = height/2 - 120; rot = 8; }
                    
                    drawPolaroid(img, x, y, rot, p.date);
                    loaded++;
                    if(loaded === photosToDraw.length) {
                         state.posterImage = canvas.toDataURL('image/png');
                         renderModalContent('newyear_poster');
                         showModal(true);
                    }
                };
            });
        }

        // --- 事件绑定 ---
        function bindEvents() {
            document.getElementById('btnLightStudio').onclick = () => {
                document.getElementById('lightPanel').classList.toggle('hidden');
            };
            document.getElementById('btnBackToCamera').onclick = () => switchView('camera');
            document.getElementById('galleryDock').onclick = () => switchView('gallery');
            document.getElementById('shutterBtn').onclick = takePhoto;
            
            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);

            document.getElementById('unlockNewYearBtn').onclick = () => {
                const ny = FRAMES.find(f => f.id === 'newyear');
                generateCollectionPoster(ny);
            };

                generateCollectionPoster(ny);
            };

            ['Smooth', 'Whiten', 'Sharp', 'Intensity', 'ThinFace', 'BigEye'].forEach(key => {
                const input = document.getElementById('input' + key);
                input.oninput = (e) => {
                    const val = parseFloat(e.target.value);
                    if (key === 'Intensity') {
                        state.fillLight.intensity = val;
                        document.getElementById('val' + key).innerText = Math.round(val * 100) + '%';
                        updateFillLight();
                    } else {
                        // 映射 mapping
                        let mapKey = key === 'Smooth' ? 'smooth' : (key === 'Whiten' ? 'whiten' : (key === 'Sharp' ? 'sharp' : (key === 'ThinFace' ? 'thinFace' : 'bigEye'))); 
                        state.beauty[mapKey] = val;
                        document.getElementById('val' + key).innerText = Math.round(val * 10);
                        updateVideoFilter();
                    }
                };
            });
        }

        // 初始化相纸栏
        function renderFramesDock() {
            const dock = document.getElementById('framesDock');
            dock.innerHTML = '';
            FRAMES.forEach(frame => {
                const isUnlocked = state.unlockedFrameIds.includes(frame.id);
                const isSelected = state.currentFrameId === frame.id;
                
                const btn = document.createElement('button');
                btn.className = `relative flex-shrink-0 w-12 h-16 rounded-md border-2 transition-all duration-300 snap-center ${isSelected ? 'border-stone-800 scale-110 shadow-md z-10' : 'border-transparent scale-95 opacity-80 hover:scale-100 hover:opacity-100'}`;
                
                if (frame.type === 'gradient') {
                    btn.style.background = `linear-gradient(135deg, ${frame.color[0]}, ${frame.color[1]})`;
                } else {
                    btn.style.backgroundColor = frame.color;
                }

                let inner = '';
                if (!isUnlocked) {
                    inner += `<div class="absolute inset-0 bg-black/20 flex items-center justify-center rounded-sm"><i data-lucide="lock" class="text-white w-4 h-4 drop-shadow-md"></i></div>`;
                }
                if (isSelected && isUnlocked) {
                    inner += `<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-1 h-1 bg-stone-800 rounded-full"></div>`;
                }
                btn.innerHTML = inner;

                btn.onclick = () => {
                    if (isUnlocked) {
                        state.currentFrameId = frame.id;
                        renderFramesDock(); 
                    } else {
                        if (frame.id === 'newyear') {
                             generateCollectionPoster(frame);
                        } else {
                            state.targetUnlockFrame = frame;
                            state.posterImage = null;
                            renderModalContent('normal');
                            showModal(true);
                        }
                    }
                };
                dock.appendChild(btn);
            });
            lucide.createIcons();
        }

        }

        function downloadOne(id) {
            const photo = state.photos.find(p => p.id == id);
            downloadPhoto(photo);
        }

        // 分享解锁逻辑
        function handleShareToUnlock(platform) {
            state.isSharing = true;
            state.didLeave = false;
            renderModalContent('sharing');
            
            const text = "RetroCam 拍立得 - 一键出片！";
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = 0;
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            if (window.innerWidth > 768) {
                setTimeout(() => {
                    if (state.isSharing && state.targetUnlockFrame) {
                        unlockFrame(state.targetUnlockFrame.id);
                        state.isSharing = false;
                        showModal(false);
                    }
                }, 4000);
            }
        }

        function unlockFrame(id) {
            if (!state.unlockedFrameIds.includes(id)) {
                state.unlockedFrameIds.push(id);
                state.currentFrameId = id;
                renderFramesDock();
                checkNewYearButton();
                showModal(false);
                alert("解锁成功！已应用新相纸");
            }
        }

    </script>
</body>
</html>
